name: Build Wine XInput Fork

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  # ----------------------------
  # 1. Build Wine Tools (x86_64)
  # ----------------------------
  build-tools:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install deps (tools)
        run: |
          sudo apt update
          sudo apt install -y flex bison cmake ninja-build ccache \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Build Wine Tools
        run: |
          mkdir -p build-tools
          cd build-tools
          ../configure --enable-win64
          make -j$(nproc)

      - name: Upload Wine Tools
        uses: actions/upload-artifact@v4
        with:
          name: wine-tools
          path: build-tools

  # ----------------------------
  # 2. Install ARM64 Dependencies
  # ----------------------------
  install-deps-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Install ARM64 Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            flex bison cmake ninja-build ccache \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libx11-dev:arm64 libxext-dev:arm64 libxrandr-dev:arm64 \
            libxinerama-dev:arm64 libxcursor-dev:arm64 libxi-dev:arm64

  # ----------------------------
  # 3. Build ARM64 Wine (XInput)
  # ----------------------------
  build-arm64:
    runs-on: ubuntu-22.04
    needs: [build-tools, install-deps-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Wine Tools
        uses: actions/download-artifact@v4
        with:
          name: wine-tools
          path: build-tools

      - name: Cache Wine ARM64 Build
        uses: actions/cache@v3
        with:
          path: build-arm64
          key: wine-build-arm64-${{ runner.os }}-${{ hashFiles('dlls/xinput1_3/main.c') }}
          restore-keys: |
            wine-build-arm64-${{ runner.os }}

      - name: Build Wine ARM64
        run: |
          mkdir -p build-arm64
          cd build-arm64
          ../configure --host=aarch64-linux-gnu --with-x --enable-win64 \
            --with-wine-tools=../build-tools
          make dlls/xinput1_3 -j$(nproc)

      - name: Upload XInput ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xinput-arm64
          path: build-arm64/dlls/xinput1_3/xinput1_3.dll.so
