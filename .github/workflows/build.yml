name: Build Wine XInput

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker QEMU (multi-arch)
        uses: docker/setup-qemu-action@v2

      - name: Pull ARM64 Ubuntu base
        run: docker pull arm64v8/ubuntu:22.04

      - name: Build in ARM64 container
        run: |
          docker run --rm --privileged -v $PWD:/src -w /src arm64v8/ubuntu:22.04 bash -c "
            apt update && \
            apt install -y gcc g++ make flex bison git cmake ninja-build \
                           libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev && \
            mkdir build-tools && cd build-tools && ../configure --enable-win64 && make -j\$(nproc) && \
            cd .. && mkdir build-arm64 && cd build-arm64 && ../configure --enable-win64 --host=aarch64-linux-gnu --with-x --with-wine-tools=../build-tools && \
            make dlls/xinput1_3 -j\$(nproc)
          "

      - name: Upload ARM64 XInput DLL
        uses: actions/upload-artifact@v4
        with:
          name: xinput-arm64
          path: build-arm64/dlls/xinput1_3/xinput1_3.dll.so
