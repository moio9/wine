name: Build Wine XInput

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-tools:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache Wine Tools
        uses: actions/cache@v3
        with:
          path: build-tools
          key: wine-build-tools-${{ runner.os }}-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            wine-build-tools-${{ runner.os }}

      - name: Install deps (tools)
        run: |
          sudo apt update
          sudo apt install -y flex bison cmake ninja-build ccache \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Build Wine Tools
        run: |
          mkdir -p build-tools
          cd build-tools
          ../configure --enable-win64
          make -j$(nproc)

      - name: Upload Wine Tools
        uses: actions/upload-artifact@v4
        with:
          name: wine-tools
          path: build-tools

  install-deps-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Install ARM64 Cross Deps
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            flex bison cmake ninja-build ccache \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

  build-arm64:
    runs-on: ubuntu-22.04
    needs: [build-tools, install-deps-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Wine Tools
        uses: actions/download-artifact@v4
        with:
          name: wine-tools
          path: build-tools

      - name: Fix Wine Tools Permissions
        run: chmod +x build-tools/tools/*

      - name: Cache Wine ARM64 Build
        uses: actions/cache@v3
        with:
          path: build-arm64
          key: wine-build-arm64-${{ runner.os }}-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            wine-build-arm64-${{ runner.os }}

      - name: Build Wine ARM64
        run: |
          mkdir -p build-arm64
          cd build-arm64
          ../configure --host=aarch64-linux-gnu --with-x --enable-win64 \
            --with-wine-tools=../build-tools
          make -j$(nproc)

      - name: Upload Full ARM64 Build
        uses: actions/upload-artifact@v4
        with:
          name: wine-arm64-full
          path: build-arm64/
