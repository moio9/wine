name: Build Wine XInput Fork

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  
jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            flex bison git cmake ninja-build

      - name: Build Wine tools (x86_64)
        run: |
          mkdir build-tools && cd build-tools
          ../configure --enable-win64
          make -j$(nproc)     # important: compilează complet tool-urile

      - name: Build ARM64 XInput
        run: |
          mkdir build-arm64 && cd build-arm64
          ../configure --host=aarch64-linux-gnu --with-x --enable-win64 \
            --with-wine-tools=../build-tools
          make dlls/xinput1_3 -j$(nproc)

      - name: Upload ARM64 XInput DLL
        uses: actions/upload-artifact@v4
        with:
          name: xinput-arm64
          path: build-arm64/dlls/xinput1_3/xinput1_3.dll.so


      - name: Upload ARM64 XInput DLL
        uses: actions/upload-artifact@v4
        with:
          name: xinput-arm64
          path: build-arm64/dlls/xinput1_3/xinput1_3.dll.so
