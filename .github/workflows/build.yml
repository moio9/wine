name: Build Wine XInput
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Enable QEMU for multi-arch
        uses: docker/setup-qemu-action@v2

      - name: Build in ARM64 Docker container
        run: |
          docker run --rm --platform linux/arm64/v8 -v $PWD:/src -w /src arm64v8/ubuntu:22.04 bash -c "
            apt update && \
            apt install -y build-essential git cmake ninja-build flex bison \
                           libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
                           clang lld wget unzip && \
            # Instalare llvm-mingw pentru aarch64-windows
            wget https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-aarch64.tar.xz && \
            tar -xf llvm-mingw-*.tar.xz && mv llvm-mingw-* /opt/llvm-mingw && \
            export PATH=/opt/llvm-mingw/bin:$PATH && \
            which aarch64-w64-mingw32-clang && \
            mkdir build-tools && cd build-tools && ../configure --enable-win64 && make -j\$(nproc) && \
            cd .. && mkdir build-arm64 && cd build-arm64 && \
            ../configure --host=aarch64-linux-gnu --enable-win64 --with-x \
                         --with-wine-tools=../build-tools \
                         --with-llvm --without-mingw && \
            make dlls/xinput1_3 -j\$(nproc)
          "

      - name: Upload ARM64 XInput DLL
        uses: actions/upload-artifact@v4
        with:
          name: xinput-arm64
          path: build-arm64/dlls/xinput1_3/xinput1_3.dll.so
