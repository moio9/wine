name: Build Wine ARM64 (Simplu)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # ======================
    # 1. Free disk space
    # ======================
    - name: Free disk space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt clean
        df -h

    # ======================
    # 2. Build Foundation Docker Image
    # ======================
    - name: Cache Docker image
      id: cache-foundation
      uses: actions/cache@v4
      with:
        path: foundation.tgz
        key: foundation-ubuntu2204-${{ hashFiles('.packaging/ubuntu2204/Dockerfile') }}
        lookup-only: true

    - name: Build foundation image
      if: ${{ steps.cache-foundation.outputs.cache-hit != 'true' }}
      run: |
        cp .packaging/ubuntu2204/Dockerfile .
        docker build -t foundationubuntu2204 .
        docker image save foundationubuntu2204 | gzip -c > foundation.tgz

    - name: Upload Foundation Image
      if: ${{ steps.cache-foundation.outputs.cache-hit != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: foundation-image
        path: foundation.tgz

    - name: Load Docker image
      if: ${{ steps.cache-foundation.outputs.cache-hit == 'true' }}
      run: docker image load -i foundation.tgz

    # ======================
    # 3. Build Wine ARM64
    # ======================
    - name: Build Wine ARM64
      run: |
        git submodule update --init --recursive wine
        cp -r .packaging/ubuntu2204/wine/* wine
        docker build -t wine-arm64 wine
        docker run --rm wine-arm64 cat /opt/hangover-wine_arm64.deb > wine_arm64.deb

    - name: Upload Wine Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wine-arm64
        path: wine_arm64.deb

    # ======================
    # 4. Build DXVK (ARM64)
    # ======================
    - name: Checkout DXVK
      uses: actions/checkout@v4
      with:
        repository: doitsujin/dxvk
        fetch-depth: 1
        path: dxvk

    - name: Build DXVK
      run: |
        docker build -t dxvk-arm64 dxvk
        docker run --rm dxvk-arm64 cat /opt/dxvk/output/dxvk.tar.gz > dxvk.tar.gz

    - name: Upload DXVK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dxvk-arm64
        path: dxvk.tar.gz

    # ======================
    # 5. Bundle All
    # ======================
    - name: Bundle Wine + DXVK
      run: tar -cf hangover_bundle_arm64.tar wine_arm64.deb dxvk.tar.gz

    - name: Upload Final Bundle
      uses: actions/upload-artifact@v4
      with:
        name: hangover-bundle-arm64
        path: hangover_bundle_arm64.tar
