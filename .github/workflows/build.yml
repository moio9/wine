name: Build Wine XInput Fork

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  # -------------------
  # x86_64 Native Build
  # -------------------
  build-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache Wine x86_64 build
        uses: actions/cache@v3
        with:
          path: build-x86_64
          key: wine-build-x86_64-${{ runner.os }}-${{ hashFiles('dlls/xinput1_3/main.c') }}
          restore-keys: |
            wine-build-x86_64-${{ runner.os }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison cmake ninja-build ccache \
                              libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
                              libxcursor-dev libxi-dev

      - name: Build Wine (x86_64)
        run: |
          mkdir -p build-tools && cd build-tools
          ../configure --enable-win64
          make -j$(nproc)
          cd ..
          mkdir -p build-x86_64 && cd build-x86_64
          ../configure --enable-win64 --with-x --with-wine-tools=../build-tools
          make -j$(nproc)

      - name: Upload full Wine x86_64 build
        uses: actions/upload-artifact@v4
        with:
          name: wine-x86_64
          path: build-x86_64

  # -------------------
  # ARM64 Cross-build (Docker)
  # -------------------
  build-arm64:
    runs-on: ubuntu-22.04
    needs: build-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Cache Wine ARM64 build
        uses: actions/cache@v3
        with:
          path: build-arm64
          key: wine-build-arm64-${{ runner.os }}-${{ hashFiles('dlls/xinput1_3/main.c') }}
          restore-keys: |
            wine-build-arm64-${{ runner.os }}

      - name: Build ARM64 in Docker
        uses: addnab/docker-run-action@v3
        with:
          image: arm64v8/ubuntu:22.04
          options: |
            --platform linux/arm64
            -v ${{ github.workspace }}:/src
          run: |
            apt-get update
            apt-get install -y gcc g++ make flex bison cmake ninja-build ccache git \
                               libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
                               libxcursor-dev libxi-dev
            cd /src
            mkdir -p build-tools && cd build-tools
            ../configure --enable-win64
            make -j$(nproc)
            cd ..
            mkdir -p build-arm64 && cd build-arm64
            ../configure --host=aarch64-linux-gnu --with-x --enable-win64 \
              --with-wine-tools=../build-tools
            make -j$(nproc)

      - name: Upload full Wine ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: wine-arm64
          path: build-arm64
