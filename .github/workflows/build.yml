name: Build Wine XInput Fork

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            flex bison git cmake ninja-build

      - name: Configure Wine for ARM64
        run: |
          mkdir build-arm64 && cd build-arm64
          ../configure --host=aarch64-linux-gnu --with-x --enable-win64

      - name: Build XInput for ARM64
        run: |
          cd build-arm64
          make dlls/xinput1_3 -j$(nproc)

      - name: Upload ARM64 XInput DLL
        uses: actions/upload-artifact@v4
        with:
          name: xinput-arm64
          path: build-arm64/dlls/xinput1_3/xinput1_3.dll.so
