name: Build Wine ARM64

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Free disk space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt clean
        df -h

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache
          /tmp
        key: ${{ runner.os }}-build-dependencies-${{ hashFiles('**/Dockerfile') }}
        restore-keys: |
          ${{ runner.os }}-build-dependencies-

    - name: Build Wine in Docker
      run: |
        cat > Dockerfile <<'EOF'
        FROM ubuntu:22.04

        # Instalează dependențele necesare
        RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc g++ cmake ninja-build flex bison \
            python3 python3-distutils python3-setuptools \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            git wget tar pkg-config
        
        WORKDIR /src
        RUN git clone https://gitlab.winehq.org/wine/wine.git --depth 1
        
        WORKDIR /src/wine
        # Configurează Wine pentru a compila doar XInput
        RUN ./configure --without-x --without-freetype --without-fontconfig --without-pcap --without-gstreamer --without-alsa --without-esd --without-cups --without-xinerama --without-opengl --enable-win64
        
        # Compilăm doar XInput
        RUN make dlls/xinput1_3
        
        # Salvează fișierul compilat
        RUN tar -czf /xinput.tar.gz -C /src/wine dlls/xinput1_3.dll.so
        
        # Rulează comanda de final
        RUN echo "XInput compilat cu succes!"

        EOF

        # Build Docker image and extract Wine
        docker build -t wine-arm64 .
        docker run --rm wine-arm64 cat /wine-arm64.tar.gz > wine-arm64.tar.gz

    - name: Upload Wine Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wine-arm64
        path: wine-arm64.tar.gz

    - name: Build Wine for ARM64ec and i386 with mingw
      run: |
        # Build Wine with LLVM mingw and targets ARM64ec, aarch64, i386
        mkdir -p wine/build
        cd wine/build
        export PATH=/opt/llvm-mingw/bin:$PATH
        ../configure --disable-tests --with-mingw=clang --enable-archs=arm64ec,aarch64,i386
        make -j$(nproc)
        sudo env PATH="$PATH" make install

    - name: Upload Wine Artifact for mingw build
      uses: actions/upload-artifact@v4
      with:
        name: wine-mingw-arm64
        path: /opt/wine64
