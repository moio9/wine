name: Build Wine XInput

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch: 

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Enable ARM64 architecture
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt update

      - name: Cache Wine build-tools (x86_64)
        uses: actions/cache@v3
        with:
          path: build-tools
          key: wine-tools-${{ runner.os }}

      - name: Cache Wine build-arm64
        uses: actions/cache@v3
        with:
          path: build-arm64
          key: wine-build-arm64-${{ runner.os }}

      - name: Install dependencies
        run: |
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            flex bison git cmake ninja-build ccache \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libx11-dev:arm64 libxext-dev:arm64 libxrandr-dev:arm64 \
            libxinerama-dev:arm64 libxcursor-dev:arm64 libxi-dev:arm64

      - name: Build Wine tools (x86_64)
        run: |
          mkdir -p build-tools && cd build-tools
          ../configure --enable-win64
          make -j$(nproc)

      - name: Build ARM64 XInput
        run: |
          mkdir -p build-arm64 && cd build-arm64
          ../configure --host=aarch64-linux-gnu --enable-win64 --with-x \
            --with-wine-tools=../build-tools
          make dlls/xinput1_3 -j$(nproc)

      - name: Upload ARM64 XInput DLL
        uses: actions/upload-artifact@v4
        with:
          name: xinput-arm64
          path: build-arm64/dlls/xinput1_3/xinput1_3.dll.so
